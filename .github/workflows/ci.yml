# The whole gate, over the whole workspace. One job: every package runs each verb
# its own way, and a verb name means one thing. Nothing here needs a browser, and
# nothing runs elsewhere.
name: CI

on:
  pull_request:
  push:
    branches: [main]

# One run per ref: a new push cancels the in-flight run for the same PR/branch.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      # `prepare` builds quiver's and ui's dist here, which is what the playground
      # then type-checks against.
      - run: npm ci

      - name: Lint (prettier)
        run: npm run lint

      - name: Check (types)
        run: npm run check

      - name: Canon spine
        run: npm run check:canon

      - name: Style scales
        run: npm run check:style

      - name: Dependency law
        run: npm run check:deps

      - name: Test (vitest)
        run: npm test

      - name: Build
        run: npm run build
