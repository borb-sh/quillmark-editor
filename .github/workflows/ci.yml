# PR gate: the tiers that run without a browser. `lint` + `check` + `check:canon`
# + `check:geometry` + `check:type` + `check:theme` are the gates; `test` is the Vitest core tier and `build` proves `svelte-package`
# still emits `dist/`. The playground browser tier stands in for a human pass and
# runs elsewhere, so it is not gated here.
name: CI

on:
  pull_request:
  push:
    branches: [main]

# One run per ref: a new push cancels the in-flight run for the same PR/branch.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Lint (prettier)
        run: npm run lint

      - name: Check (svelte-check)
        run: npm run check

      - name: Canon spine
        run: npm run check:canon

      - name: Geometry scale
        run: npm run check:geometry

      - name: Type scale
        run: npm run check:type

      - name: Theme
        run: npm run check:theme

      - name: Test (vitest)
        run: npm test

      - name: Build (svelte-package)
        run: npm run build
