# Publish one package, on the merge of the PR for the branch release-prepare.yml pushed.
# The branch name carries what is being released; package.json is what proves it.
# Everything that can fail freely runs before the tag, because the tag is the last
# point at which a failure costs nothing: a dangling tag is deleted, a published
# version is permanent.
name: Release

on:
  pull_request:
    types: [closed]
    branches: [main]

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    if: github.event.pull_request.merged == true && startsWith(github.event.pull_request.head.ref, 'release/')
    runs-on: ubuntu-latest
    environment: release
    permissions:
      # npm Trusted Publishing (OIDC token exchange); no stored token.
      id-token: write
      # The tag and the GitHub Release.
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Read the release from the branch name
        id: release
        run: |
          BRANCH="${{ github.event.pull_request.head.ref }}"
          if [[ ! "$BRANCH" =~ ^release/([a-z]+)-v(.+)$ ]]; then
            echo "::error::$BRANCH is not release/<package>-v<version>"
            exit 1
          fi
          PKG="${BASH_REMATCH[1]}"
          VERSION="${BASH_REMATCH[2]}"

          # The branch name is a claim and package.json is the fact; a mismatch
          # would tag one version and publish another.
          ACTUAL=$(node -p "require('./packages/$PKG/package.json').version")
          if [ "$ACTUAL" != "$VERSION" ]; then
            echo "::error::branch says v$VERSION, packages/$PKG/package.json says v$ACTUAL"
            exit 1
          fi

          echo "pkg=$PKG" >> "$GITHUB_OUTPUT"
          # The registry name, read rather than spelled from the directory: not every
          # package here is scoped, and a hardcoded `@quillmark/` would name a package
          # that does not exist for the ones that are not.
          echo "name=$(node -p "require('./packages/$PKG/package.json').name")" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=${PKG}-v${VERSION}" >> "$GITHUB_OUTPUT"

      - run: npm ci

      # ci.yml's verbs through the suite, in one script and in its order; there they
      # are separate steps to buy failure attribution, here they only need to pass.
      # `build` is among them because the suite reads what it writes, and it stays
      # workspace-wide: the suite is the whole workspace's whichever package is being
      # released, so a scoped build leaves quillkit's bin or studio's client missing.
      - name: Gate
        run: npm run gate

      # ci.yml's last verb, scoped: publint reads the `dist` the released package's
      # manifest points at.
      - name: Package (publint)
        run: npm run check:pack -w packages/${{ steps.release.outputs.pkg }}

      - name: Tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "${{ steps.release.outputs.tag }}" \
            -m "${{ steps.release.outputs.name }} ${{ steps.release.outputs.version }}"
          git push origin "${{ steps.release.outputs.tag }}"

      # Trusted Publishing requires npm >= 11.5.1.
      - name: Upgrade npm for Trusted Publishing
        run: npm install -g npm@latest

      # Skipping a version the registry already has is what makes the job safe to
      # re-run, and it is the whole of the first-publish bootstrap: a package with
      # no versions has no trusted publisher to configure, so its first upload is
      # a hand publish from the release branch and this run agrees rather than
      # 403s on it.
      - name: Publish
        run: |
          PKG="${{ steps.release.outputs.pkg }}"
          NAME="${{ steps.release.outputs.name }}"
          VERSION="${{ steps.release.outputs.version }}"
          if [ "$(npm view "${NAME}@${VERSION}" version 2>/dev/null)" = "$VERSION" ]; then
            echo "${NAME}@${VERSION} is already on the registry; nothing to publish."
            exit 0
          fi
          npm publish -w "packages/$PKG" --provenance --access public

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PKG="${{ steps.release.outputs.pkg }}"
          NAME="${{ steps.release.outputs.name }}"
          VERSION="${{ steps.release.outputs.version }}"

          # The version's own section, verbatim: everything between its heading
          # and the next one.
          awk -v v="## v${VERSION} - " \
            'index($0, v) == 1 {f=1; next} /^## / && f {exit} f {print}' \
            "packages/$PKG/CHANGELOG.md" > notes.md || true
          # A whitespace-only section would publish blank notes, and `-s` alone is
          # true for one.
          grep -q '[^[:space:]]' notes.md || echo "${NAME} ${VERSION}" > notes.md

          # No release is the repository's latest: the packages release on their
          # own clocks, so whichever went last would claim the label for all.
          gh release create "${{ steps.release.outputs.tag }}" \
            --title "${NAME} ${VERSION}" \
            --notes-file notes.md \
            --latest=false
