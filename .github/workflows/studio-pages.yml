# Lay a quiver's studio out as a Pages artifact, for a quiver author's own repository
# to call. Build and upload only: the deploy stays in the caller's workflow, so nothing
# outside their repository ever holds `pages: write`.
#
# The layout itself is `quillmark-studio site`, and this calls it rather than restating it: the
# client at some base with a built quiver at `quiver/` under it, which is where the
# client looks (`document.baseURI`). The assertions travel with the verb, so a caller
# running it locally gates the same shape this does: a client carrying a quiver of its
# own would occupy the URL the built one is served from.
name: Studio Pages

on:
  workflow_call:
    inputs:
      quiver-dir:
        description: The collection root, relative to the repository. `Quiver.yaml` lives here.
        type: string
        default: .
      studio-package:
        description: The client to serve — an npm spec, or a path to a package in the caller's checkout.
        type: string
        default: '@quillmark/studio@latest'
      node-version:
        description: Node to build under.
        type: string
        default: '22'
      upload:
        description: Upload the Pages artifact. False assembles and asserts the site without minting one.
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # `inputs` reaches a job's env and `runner` does not, so the site is spelled
      # from `$RUNNER_TEMP` in the steps that use it. Outside the workspace either
      # way: the author's checkout is theirs, and `quillmark-quiver build` owns what it writes.
      QUIVER_DIR: ${{ inputs.quiver-dir }}
      STUDIO_PACKAGE: ${{ inputs.studio-package }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}

      # The packer is the caller's own: `quillmark-studio site` resolves `@quillmark/quiver` from
      # the collection's `node_modules`, so the pack this deploys is the one their
      # `quillmark-quiver test` gates with. It packs files and instantiates nothing, so no wasm is
      # installed here. A repository that does not carry the CLI gets a copy fetched by
      # name, never by bare bin (`quiver` on the registry is not this).
      - name: Resolve the quiver packer
        run: |
          if [ -f package-lock.json ]; then npm ci
          elif [ -f package.json ]; then npm install --no-audit --no-fund
          fi
          if [ ! -d node_modules/@quillmark/quiver ]; then
            npm install --no-save --no-audit --no-fund @quillmark/quiver
          fi
          test -d node_modules/@quillmark/quiver \
            || { echo "::error::no @quillmark/quiver resolved in $GITHUB_WORKSPACE"; exit 1; }

      # `npm pack` takes a registry spec or a directory; a directory is built through
      # its own `prepack` first, which is how this repository rehearses the layout
      # against a client that is not published yet.
      - name: Fetch the client
        run: |
          # Globbed from a directory of its own rather than read off stdout: a local
          # path is built through `prepack` first, whose output is on stdout too.
          mkdir -p "$RUNNER_TEMP/pack" "$RUNNER_TEMP/client"
          npm pack "$STUDIO_PACKAGE" --pack-destination "$RUNNER_TEMP/pack" >/dev/null
          TGZ=$(find "$RUNNER_TEMP/pack" -maxdepth 1 -name '*.tgz' | head -1)
          test -n "$TGZ" || { echo "::error::npm pack $STUDIO_PACKAGE produced no tarball"; exit 1; }
          tar -xzf "$TGZ" -C "$RUNNER_TEMP/client" --strip-components=1
          test -f "$RUNNER_TEMP/client/bin/cli.js" \
            || { echo "::error::$STUDIO_PACKAGE carries no bin at bin/cli.js"; exit 1; }

      # One verb, and it owns the whole arrangement: the client it ships laid at the
      # root, the caller's collection packed beneath it, and both halves of the layout
      # asserted. Run from the workspace, so `--quiver` is read the way the input is
      # written, relative to the repository.
      - name: Lay the site out
        run: |
          node "$RUNNER_TEMP/client/bin/cli.js" site \
            --quiver "$QUIVER_DIR" \
            --out "$RUNNER_TEMP/studio-site"
          echo "Site: $(find "$RUNNER_TEMP/studio-site" -type f | wc -l) files"

      - if: inputs.upload
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/studio-site
