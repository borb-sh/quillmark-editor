# The whole gate, over the whole workspace. The verbs are one job: every package runs
# each its own way, and a verb name means one thing. Nothing here needs a browser, and
# nothing runs elsewhere.
#
# The second job is the deploy rehearsal, and it runs the reusable workflow a quiver
# author calls rather than a copy of it: a layout that only this repository exercises
# would break for them first.
name: CI

on:
  pull_request:
  push:
    branches: [main]

# One run per ref: a new push cancels the in-flight run for the same PR/branch.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      # `prepare` builds quiver's and ui's dist here, which is what the playground
      # then type-checks against.
      - run: npm ci

      - name: Lint (prettier)
        run: npm run lint

      - name: Check (types)
        run: npm run check

      - name: Canon spine
        run: npm run check:canon

      - name: Style scales
        run: npm run check:style

      - name: Dependency law
        run: npm run check:deps

      # Before the suite: quillkit is reached through the bin an author runs, and the
      # client it serves is `vite build`'s output, so both are built artifacts the
      # suite spawns and reads rather than modules it imports.
      - name: Build
        run: npm run build

      - name: Test (vitest)
        run: npm test

      # After the build, because publint reads the `dist` the manifest points at.
      - name: Package (publint)
        run: npm run check:pack

  # The workspace's own quiver through the author's path: `npm pack` builds the local
  # tool, client included, so this gates both and the layout together, against the
  # fixture the rest of the suite runs on. No artifact is minted — a rehearsal is not a
  # deploy, and this repository's Pages holds the playground.
  studio-pages:
    uses: ./.github/workflows/studio-pages.yml
    with:
      quiver-dir: fixtures
      quillkit-package: ./packages/quillkit
      upload: false
