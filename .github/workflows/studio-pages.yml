# Lay a quiver's studio out as a Pages artifact, for a quiver author's own repository
# to call. Build and upload only: the deploy stays in the caller's workflow, so nothing
# outside their repository ever holds `pages: write`.
#
# The layout itself is `quillkit site`, and this calls it rather than restating it: the
# client at some base with a built quiver at `quiver/` under it, which is where the
# client looks (`document.baseURI`). The assertions travel with the verb, so a caller
# running it locally gates the same shape this does: a client carrying a quiver of its
# own would occupy the URL the built one is served from.
name: Studio Pages

on:
  workflow_call:
    inputs:
      quiver-dir:
        description: The collection root, relative to the repository. `Quiver.yaml` lives here.
        type: string
        default: .
      quillkit-package:
        description: The tool that lays the site out, client included — an npm spec, or a path to a package in the caller's checkout.
        type: string
        default: quillkit@latest
      node-version:
        description: Node to build under.
        type: string
        default: '22'
      upload:
        description: Upload the Pages artifact. False assembles and asserts the site without minting one.
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # `inputs` reaches a job's env and `runner` does not, so the site is spelled
      # from `$RUNNER_TEMP` in the steps that use it. Outside the workspace either
      # way: the author's checkout is theirs, and `quillkit build` owns what it writes.
      QUIVER_DIR: ${{ inputs.quiver-dir }}
      QUILLKIT_PACKAGE: ${{ inputs.quillkit-package }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}

      # The packer is the caller's own: `quillkit site` resolves `@quillmark/quiver`
      # from the collection's `node_modules`, so the pack this deploys is the one their
      # `quillkit test` gates with. It packs files and instantiates nothing, so no wasm
      # is installed here.
      - name: Resolve the quiver packer
        run: |
          if [ -f package-lock.json ]; then npm ci
          elif [ -f package.json ]; then npm install --no-audit --no-fund
          fi
          if [ ! -d node_modules/@quillmark/quiver ]; then
            npm install --no-save --no-audit --no-fund @quillmark/quiver
          fi
          test -d node_modules/@quillmark/quiver \
            || { echo "::error::no @quillmark/quiver resolved in $GITHUB_WORKSPACE"; exit 1; }

      # One tarball, both halves: the tool carries the client it serves, so nothing here
      # names a client. `npm pack` takes a registry spec or a directory; a directory is
      # built through its own `prepack` first, which is how this repository rehearses the
      # layout against a tool that is not published yet. It is unpacked rather than
      # installed, so it lands nowhere near the copies the caller pinned.
      - name: Fetch the tool
        run: |
          # Globbed from a directory of its own rather than read off stdout: a local
          # path is built through `prepack` first, whose output is on stdout too.
          mkdir -p "$RUNNER_TEMP/pack" "$RUNNER_TEMP/tool"
          npm pack "$QUILLKIT_PACKAGE" --pack-destination "$RUNNER_TEMP/pack" >/dev/null
          TGZ=$(find "$RUNNER_TEMP/pack" -maxdepth 1 -name '*.tgz' | head -1)
          test -n "$TGZ" || { echo "::error::npm pack $QUILLKIT_PACKAGE produced no tarball"; exit 1; }
          tar -xzf "$TGZ" -C "$RUNNER_TEMP/tool" --strip-components=1
          test -f "$RUNNER_TEMP/tool/dist/bin/quillkit.js" \
            || { echo "::error::$QUILLKIT_PACKAGE carries no bin at dist/bin/quillkit.js"; exit 1; }
          test -f "$RUNNER_TEMP/tool/dist/client/index.html" \
            || { echo "::error::$QUILLKIT_PACKAGE carries no client at dist/client/index.html"; exit 1; }

      # One verb, and it owns the whole arrangement: the client laid at the root, the
      # caller's collection packed beneath it, and both halves of the layout asserted.
      # Run from the workspace, so `--quiver` is read the way the input is written,
      # relative to the repository.
      - name: Lay the site out
        run: |
          node "$RUNNER_TEMP/tool/dist/bin/quillkit.js" site \
            --quiver "$QUIVER_DIR" \
            --out "$RUNNER_TEMP/studio-site"
          echo "Site: $(find "$RUNNER_TEMP/studio-site" -type f | wc -l) files"

      - if: inputs.upload
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/studio-site
