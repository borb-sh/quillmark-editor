# The whole gate. `lint` + `check` + `check:canon` + `check:style` are the checks,
# `test` is the Vitest tier, and `build` proves `svelte-package` still emits
# `dist/`. Nothing here needs a browser, and nothing runs elsewhere.
name: CI

on:
  pull_request:
  push:
    branches: [main]

# One run per ref: a new push cancels the in-flight run for the same PR/branch.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Lint (prettier)
        run: npm run lint

      - name: Check (svelte-check)
        run: npm run check

      - name: Canon spine
        run: npm run check:canon

      - name: Style scales
        run: npm run check:style

      - name: Test (vitest)
        run: npm test

      - name: Build (svelte-package)
        run: npm run build
