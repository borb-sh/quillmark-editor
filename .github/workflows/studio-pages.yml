# Lay a quiver's studio out as a Pages artifact, for a quiver author's own repository
# to call. Build and upload only: the deploy stays in the caller's workflow, so nothing
# outside their repository ever holds `pages: write`.
#
# The whole of the layout is that the client is served at some base with a built quiver
# at `quiver/` under it, which is where the client looks (`document.baseURI`). Both
# halves of that are asserted rather than assumed: a client carrying a quiver of its own
# occupies the URL the built one is served from, and the winner would be whichever copy
# landed last.
name: Studio Pages

on:
  workflow_call:
    inputs:
      quiver-dir:
        description: The collection root, relative to the repository. `Quiver.yaml` lives here.
        type: string
        default: .
      studio-package:
        description: The client to serve — an npm spec, or a path to a package in the caller's checkout.
        type: string
        default: '@quillmark/studio@latest'
      node-version:
        description: Node to build under.
        type: string
        default: '22'
      upload:
        description: Upload the Pages artifact. False assembles and asserts the site without minting one.
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # `inputs` reaches a job's env and `runner` does not, so the site is spelled
      # from `$RUNNER_TEMP` in the steps that use it. Outside the workspace either
      # way: the author's checkout is theirs, and `quiver build` owns what it writes.
      QUIVER_DIR: ${{ inputs.quiver-dir }}
      STUDIO_PACKAGE: ${{ inputs.studio-package }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}

      # `quiver build` packs files and instantiates nothing, so no wasm is installed
      # here. A repository that already carries the CLI builds through its own copy,
      # which is the one its `quiver test` gates with; one that does not gets a copy
      # fetched by name, never by bare bin (`quiver` on the registry is not this).
      - name: Resolve the quiver CLI
        run: |
          if [ -f package-lock.json ]; then npm ci
          elif [ -f package.json ]; then npm install --no-audit --no-fund
          fi
          if [ ! -x node_modules/.bin/quiver ]; then
            npm install --no-save --no-audit --no-fund @quillmark/quiver
          fi
          test -x node_modules/.bin/quiver \
            || { echo "::error::no quiver CLI resolved in $GITHUB_WORKSPACE"; exit 1; }

      # `npm pack` takes a registry spec or a directory; a directory is built through
      # its own `prepack` first, which is how this repository rehearses the layout
      # against a client that is not published yet.
      - name: Fetch the client
        run: |
          # Globbed from a directory of its own rather than read off stdout: a local
          # path is built through `prepack` first, whose output is on stdout too.
          mkdir -p "$RUNNER_TEMP/pack" "$RUNNER_TEMP/client"
          npm pack "$STUDIO_PACKAGE" --pack-destination "$RUNNER_TEMP/pack" >/dev/null
          TGZ=$(find "$RUNNER_TEMP/pack" -maxdepth 1 -name '*.tgz' | head -1)
          test -n "$TGZ" || { echo "::error::npm pack $STUDIO_PACKAGE produced no tarball"; exit 1; }
          tar -xzf "$TGZ" -C "$RUNNER_TEMP/client" --strip-components=1
          test -f "$RUNNER_TEMP/client/dist/index.html" \
            || { echo "::error::$STUDIO_PACKAGE carries no client at dist/"; exit 1; }
          test ! -e "$RUNNER_TEMP/client/dist/quiver" \
            || { echo "::error::$STUDIO_PACKAGE carries a quiver; it would shadow this site's"; exit 1; }

      - name: Lay the site out
        run: |
          SITE="$RUNNER_TEMP/studio-site"
          rm -rf "$SITE"
          mkdir -p "$SITE"
          cp -R "$RUNNER_TEMP/client/dist/." "$SITE/"
          ( cd "$QUIVER_DIR" && "$GITHUB_WORKSPACE/node_modules/.bin/quiver" build --out "$SITE/quiver" )
          test -f "$SITE/quiver/latest.json" \
            || { echo "::error::$QUIVER_DIR built no pointer at quiver/latest.json"; exit 1; }
          echo "Site: $(find "$SITE" -type f | wc -l) files"

      - if: inputs.upload
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/studio-site
